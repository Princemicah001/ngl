<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Send anonymous message - NGL</title>
        <meta name="theme-color" content="#fa0f5c" />

        <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
        <link rel="dns-prefetch" href="https://www.gstatic.com" />
        <link
            rel="modulepreload"
            href="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"
        />
        <link
            rel="modulepreload"
            href="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"
        />

        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                -webkit-tap-highlight-color: transparent;
                box-sizing: border-box;
            }
            html,
            body {
                min-height: 100dvh;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: linear-gradient(
                    180deg,
                    #e60067 0%,
                    #fa0f5c 50%,
                    #ff6600 100%
                );
                background-attachment: fixed;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                overflow-x: hidden;
            }
            @keyframes shake-expand {
                0%,
                100% {
                    transform: scale(1) rotate(0);
                }
                15% {
                    transform: scale(1.04) rotate(-2deg);
                }
                30% {
                    transform: scale(1.04) rotate(2deg);
                }
                45% {
                    transform: scale(1.04) rotate(-2deg);
                }
                60% {
                    transform: scale(1.04) rotate(2deg);
                }
                75% {
                    transform: scale(1.06) rotate(0);
                }
            }
            .shake-expand {
                animation: shake-expand 2s ease-in-out infinite;
                transform-origin: center;
            }
            .shake-expand-once {
                animation: shake-expand 1.2s ease-in-out 1;
            }
            @keyframes cardIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .card-in {
                animation: cardIn 0.28s ease-out;
            }
        </style>
    </head>
    <body
        class="flex flex-col items-center justify-center min-h-screen px-4 text-slate-900 antialiased"
    >
        <div
            id="error-view"
            class="hidden w-full max-w-sm bg-white rounded-[32px] p-8 text-center shadow-2xl flex-col items-center"
        >
            <span class="text-6xl mb-4">⚠️</span>
            <h2 class="text-2xl font-black text-slate-900 mb-2">
                User Not Found
            </h2>
            <p class="text-slate-500 font-medium mb-6">
                This link is invalid or the user has deleted their account.
            </p>
            <a
                href="/"
                class="w-full bg-black text-white font-black py-4 rounded-full block"
                >Get your own link</a
            >
        </div>

        <div
            id="paused-view"
            class="hidden w-full max-w-sm bg-white rounded-[32px] p-8 text-center shadow-2xl flex-col items-center"
        >
            <span class="text-6xl mb-4">⏸️</span>
            <h2 class="text-2xl font-black text-slate-900 mb-2">Link Paused</h2>
            <p class="text-slate-500 font-medium mb-6">
                This user has temporarily paused their anonymous messages.
            </p>
            <a
                href="/"
                class="w-full bg-black text-white font-black py-4 rounded-full block"
                >Get your own link</a
            >
        </div>

        <div
            id="sender-wrap"
            class="w-full max-w-[340px] sm:max-w-md flex-col items-center flex card-in"
            aria-busy="true"
        >
            <form
                id="send-form"
                class="w-full bg-white rounded-[32px] shadow-2xl flex flex-col overflow-hidden mb-4"
            >
                <div
                    class="bg-gradient-to-r from-[#fa0f5c] to-[#ff5100] p-6 flex items-center gap-4"
                >
                    <div
                        class="w-16 h-16 rounded-full bg-white p-1 shadow-md flex items-center justify-center overflow-hidden flex-shrink-0"
                    >
                        <img
                            id="avatar-img"
                            class="w-full h-full rounded-full object-cover hidden"
                        />
                        <div
                            id="avatar-fallback"
                            class="w-full h-full rounded-full bg-slate-300 animate-pulse"
                        ></div>
                    </div>
                    <div class="flex-1 min-w-0 text-left">
                        <p
                            id="recipient-handle"
                            class="text-white/90 text-sm font-bold truncate"
                        >
                            <span
                                class="inline-block w-20 h-3 bg-white/40 rounded animate-pulse align-middle"
                            ></span>
                        </p>
                        <h2
                            id="recipient-prompt"
                            class="text-white font-extrabold text-xl leading-tight mt-1"
                        >
                            <span
                                class="inline-block w-40 h-5 bg-white/40 rounded animate-pulse"
                            ></span>
                        </h2>
                    </div>
                </div>

                <div class="p-5 flex flex-col gap-4">
                    <div
                        class="bg-[#f4f5f8] rounded-[24px] p-4 flex flex-col justify-between min-h-[160px]"
                    >
                        <textarea
                            id="msg-input"
                            placeholder="Type your anonymous message..."
                            maxlength="500"
                            rows="4"
                            class="w-full text-lg font-bold text-slate-800 placeholder:text-[#a0abbd] placeholder:font-medium bg-transparent border-0 outline-none resize-none leading-relaxed"
                        ></textarea>
                        <div
                            id="attach-list"
                            class="flex flex-col gap-2 mt-2"
                        ></div>
                    </div>

                    <div class="flex items-center justify-between px-1">
                        <span class="text-xs font-bold text-slate-400"
                            >Attach files</span
                        >
                        <button
                            type="button"
                            id="attach-btn"
                            class="flex items-center gap-1.5 text-sm font-extrabold text-black bg-[#dce2ec] hover:bg-[#cfd7e3] px-4 py-2 rounded-full transition-all active:scale-95"
                        >
                            <svg
                                class="w-4 h-4"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.5"
                            >
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                                />
                            </svg>
                            Attach
                        </button>
                        <input
                            id="file-input"
                            type="file"
                            multiple
                            class="hidden"
                        />
                    </div>
                </div>
            </form>

            <button
                id="send-btn"
                disabled
                class="w-full bg-black text-white font-extrabold text-xl py-4 rounded-full shadow-xl active:scale-95 transition-all mb-2 opacity-60 cursor-not-allowed"
            >
                Send!
            </button>
            <p
                id="char-count"
                class="text-white/80 font-bold text-sm tracking-wider text-center mb-1"
            >
                0/500
            </p>
            <p
                id="load-status"
                class="text-white/90 text-xs font-bold text-center mb-3 min-h-[1em] tracking-wide"
            >
                Preparing…
            </p>
            <button
                id="retry-btn"
                onclick="retryLoad()"
                class="hidden mb-3 bg-white/25 backdrop-blur-md text-white font-bold py-2.5 px-7 rounded-full text-sm shadow-lg active:scale-95 transition"
            >
                Try again
            </button>

            <div class="flex flex-col items-center">
                <img
                    src="https://framerusercontent.com/images/I5OG1V7seR2tatnsaXFQ2fIQpHA.png"
                    alt="NGL"
                    class="h-10 w-auto object-contain drop-shadow-md"
                    onerror="this.style.display = 'none'"
                />
                <span class="text-white font-black text-sm mt-2"
                    >anonymous q&a</span
                >
            </div>
        </div>

        <div
            id="success-view"
            class="hidden w-full max-w-sm flex-col items-center"
        >
            <div
                class="w-full bg-white rounded-[32px] p-8 text-center shadow-2xl flex flex-col items-center"
            >
                <div
                    class="w-20 h-20 bg-gradient-to-tr from-[#fa0f5c] to-[#fc6320] rounded-full flex items-center justify-center text-white mb-6 shadow-lg"
                >
                    <svg
                        class="w-10 h-10"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                    >
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                </div>
                <h2
                    class="text-3xl font-black text-slate-900 mb-2 lowercase tracking-tight"
                >
                    sent anonymously!
                </h2>
                <p id="success-to" class="text-slate-500 font-medium mb-8"></p>
                <button
                    id="send-another-btn"
                    class="w-full bg-black text-white font-extrabold text-lg py-4 rounded-full shadow-md active:scale-95 transition-transform mb-3"
                >
                    Send Another
                </button>
                <a
                    href="/"
                    id="own-link-btn"
                    class="w-full bg-slate-100 text-slate-800 font-bold py-4 rounded-full text-sm text-center block shake-expand"
                >
                    Get your own NGL link
                </a>
            </div>
        </div>

        <script src="/firebase-config.js"></script>
        <script src="/backend.js"></script>
        <script>
            const params = new URLSearchParams(location.search);
            const targetHandle = (params.get("to") || "")
                .trim()
                .toLowerCase()
                .replace(/^@/, "");
            let recipient = null;
            let files = [];
            let isReady = false;
            let loadId = 0;
            const $ = (id) => document.getElementById(id);

            if (!targetHandle) window.location.href = "/";

            /* Pre-warm firebase so sendMessage is instant once the user taps Send */
            const bootPromise = Backend.init();

            function withTimeout(promise, ms, label) {
                return Promise.race([
                    promise,
                    new Promise((_, rej) =>
                        setTimeout(
                            () =>
                                rej(
                                    new Error(
                                        `${label || "Operation"} timed out after ${ms}ms`,
                                    ),
                                ),
                            ms,
                        ),
                    ),
                ]);
            }

            /* =====================================================
               CACHE — 24 h localStorage. Return visitors are instant.
            ===================================================== */
            const CACHE_TTL = 24 * 60 * 60 * 1000;
            const cacheKey = (h) => `ngl_profile_cache_${h}`;
            function readCache(handle) {
                try {
                    const raw = localStorage.getItem(cacheKey(handle));
                    if (!raw) return null;
                    const { data, ts } = JSON.parse(raw);
                    if (Date.now() - ts > CACHE_TTL) return null;
                    return data;
                } catch {
                    return null;
                }
            }
            function writeCache(handle, data) {
                try {
                    localStorage.setItem(
                        cacheKey(handle),
                        JSON.stringify({ data, ts: Date.now() }),
                    );
                } catch {}
            }
            function clearCache(handle) {
                try {
                    localStorage.removeItem(cacheKey(handle));
                } catch {}
            }

            /* =====================================================
               RENDER RECIPIENT
            ===================================================== */
            function showRecipient(r) {
                recipient = r;
                $("recipient-handle").textContent = "@" + r.handle;
                $("recipient-prompt").textContent =
                    r.prompt || "send me anonymous messages!";

                if (r.photoURL) {
                    $("avatar-img").src = r.photoURL;
                    $("avatar-img").classList.remove("hidden");
                    $("avatar-fallback").classList.add("hidden");
                } else {
                    const fb = $("avatar-fallback");
                    fb.classList.remove("animate-pulse", "bg-slate-300");
                    fb.classList.add(
                        "bg-slate-900",
                        "flex",
                        "items-center",
                        "justify-center",
                        "text-white",
                        "font-black",
                        "text-2xl",
                    );
                    fb.textContent = (r.handle[0] || "U").toUpperCase();
                }

                isReady = true;
                $("send-btn").disabled = false;
                $("send-btn").classList.remove(
                    "opacity-60",
                    "cursor-not-allowed",
                );
                $("sender-wrap").setAttribute("aria-busy", "false");
                $("load-status").classList.add("hidden");
                $("retry-btn").classList.add("hidden");
            }

            /* =====================================================
               CONFETTI
            ===================================================== */
            function burstConfetti() {
                const canvas = document.createElement("canvas");
                canvas.style.cssText =
                    "position:fixed;inset:0;pointer-events:none;z-index:99999";
                const DPR = window.devicePixelRatio || 1;
                const W = window.innerWidth,
                    H = window.innerHeight;
                canvas.width = W * DPR;
                canvas.height = H * DPR;
                canvas.style.width = W + "px";
                canvas.style.height = H + "px";
                document.body.appendChild(canvas);
                const ctx = canvas.getContext("2d");
                ctx.scale(DPR, DPR);
                const colors = [
                    "#fa0f5c",
                    "#ff5100",
                    "#ffd700",
                    "#ff3366",
                    "#00d4ff",
                    "#22c55e",
                    "#a855f7",
                ];
                const particles = [];
                for (let i = 0; i < 180; i++) {
                    particles.push({
                        x: W / 2 + (Math.random() - 0.5) * 60,
                        y: H / 2 + (Math.random() - 0.5) * 60,
                        vx: (Math.random() - 0.5) * 14,
                        vy: (Math.random() - 1) * 17 - 2,
                        size: Math.random() * 8 + 3,
                        color: colors[
                            Math.floor(Math.random() * colors.length)
                        ],
                        rotation: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() - 0.5) * 0.4,
                        life: 1,
                        shape: Math.random() > 0.5 ? "rect" : "circle",
                    });
                }
                function animate() {
                    ctx.clearRect(0, 0, W, H);
                    let alive = false;
                    particles.forEach((p) => {
                        p.vy += 0.55;
                        p.vx *= 0.99;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.rotation += p.rotationSpeed;
                        p.life -= 0.008;
                        if (p.life > 0 && p.y < H + 60) {
                            alive = true;
                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.rotate(p.rotation);
                            ctx.globalAlpha = Math.max(p.life, 0);
                            ctx.fillStyle = p.color;
                            if (p.shape === "rect") {
                                ctx.fillRect(
                                    -p.size / 2,
                                    -p.size / 2,
                                    p.size,
                                    p.size * 0.6,
                                );
                            } else {
                                ctx.beginPath();
                                ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                                ctx.fill();
                            }
                            ctx.restore();
                        }
                    });
                    if (alive) requestAnimationFrame(animate);
                    else canvas.remove();
                }
                animate();
            }

            /* =====================================================
               ATTACHMENTS
            ===================================================== */
            function readFileAsDataURL(file) {
                return new Promise((res, rej) => {
                    const r = new FileReader();
                    r.onload = () => res(r.result);
                    r.onerror = rej;
                    r.readAsDataURL(file);
                });
            }

            function renderFiles() {
                $("attach-list").innerHTML = files
                    .map(
                        (f, i) => `
                    <div class="bg-white rounded-xl p-2 flex items-center gap-3 border border-slate-100">
                        ${f.type.startsWith("image/") ? `<img src="${f.dataURL}" class="w-10 h-10 rounded-lg object-cover" />` : '<div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center font-bold">📎</div>'}
                        <div class="flex-1 min-w-0 text-left">
                            <p class="text-xs font-bold truncate">${f.name}</p>
                        </div>
                        <button type="button" data-i="${i}" class="remove-file p-1.5 rounded-full bg-slate-100 hover:bg-red-100 text-black">✕</button>
                    </div>
                `,
                    )
                    .join("");
                document.querySelectorAll(".remove-file").forEach((b) => {
                    b.addEventListener("click", () => {
                        files.splice(parseInt(b.dataset.i), 1);
                        renderFiles();
                    });
                });
            }

            $("attach-btn").addEventListener("click", () =>
                $("file-input").click(),
            );
            $("file-input").addEventListener("change", async (e) => {
                for (const file of Array.from(e.target.files)) {
                    if (file.size > 3 * 1024 * 1024) {
                        alert(file.name + " is too large (max 3MB).");
                        continue;
                    }
                    const dataURL = await readFileAsDataURL(file);
                    files.push({
                        id:
                            Date.now() +
                            "_" +
                            Math.random().toString(36).slice(2, 7),
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        dataURL,
                    });
                }
                e.target.value = "";
                renderFiles();
            });

            $("msg-input").addEventListener("input", (e) => {
                $("char-count").textContent = e.target.value.length + "/500";
            });

            /* =====================================================
               SEND
            ===================================================== */
            $("send-btn").addEventListener("click", async () => {
                if (!isReady) return;

                const text = $("msg-input").value.trim();
                if (!text && files.length === 0) {
                    $("send-btn").classList.add("shake-expand-once");
                    setTimeout(
                        () =>
                            $("send-btn").classList.remove("shake-expand-once"),
                        1300,
                    );
                    return;
                }

                $("send-btn").textContent = "Sending…";
                $("send-btn").disabled = true;

                try {
                    await Backend.sendMessage(targetHandle, {
                        text: text.slice(0, 500),
                        files,
                    });

                    $("sender-wrap").classList.add("hidden");
                    $("sender-wrap").classList.remove("flex");
                    $("success-to").textContent =
                        "@" + recipient.handle + " received your message.";
                    $("success-view").classList.remove("hidden");
                    $("success-view").classList.add("flex");
                    burstConfetti();
                } catch (e) {
                    console.error("[NGL] send failed:", e);
                    alert("Failed to send. Please tap Send again to retry.");
                    $("send-btn").textContent = "Send!";
                    $("send-btn").disabled = false;
                    $("send-btn").classList.remove(
                        "opacity-60",
                        "cursor-not-allowed",
                    );
                }
            });

            /* =====================================================
               SEND ANOTHER — reset in place, no page reload
            ===================================================== */
            function resetSenderForm() {
                $("msg-input").value = "";
                $("char-count").textContent = "0/500";
                files = [];
                renderFiles();
                $("file-input").value = "";
                $("send-btn").textContent = "Send!";
                $("send-btn").disabled = false;
                $("send-btn").classList.remove(
                    "opacity-60",
                    "cursor-not-allowed",
                );
                $("success-view").classList.add("hidden");
                $("success-view").classList.remove("flex");
                $("sender-wrap").classList.remove("hidden");
                $("sender-wrap").classList.add("flex");
                window.scrollTo(0, 0);
                $("msg-input").focus();
            }
            $("send-another-btn").addEventListener("click", resetSenderForm);

            /* =====================================================
               RETRY (when profile load fails)
            ===================================================== */
            function retryLoad() {
                clearCache(targetHandle);
                loadRecipient();
            }
            window.retryLoad = retryLoad;

            /* =====================================================
               LOAD FLOW
            ===================================================== */
            async function loadRecipient() {
                const myId = ++loadId;
                const status = $("load-status");
                const retry = $("retry-btn");

                status.classList.remove("hidden");
                retry.classList.add("hidden");

                const cached = readCache(targetHandle);
                if (cached && !cached.paused) {
                    console.info("[NGL] Cache hit for", targetHandle);
                    showRecipient(cached);
                    bootPromise
                        .then(() => Backend.getProfile(targetHandle))
                        .then((fresh) => {
                            if (!fresh) return;
                            if (
                                JSON.stringify(fresh) !== JSON.stringify(cached)
                            ) {
                                writeCache(targetHandle, fresh);
                                if (myId === loadId) showRecipient(fresh);
                            }
                        })
                        .catch(() => {});
                    return;
                }

                status.textContent = "Connecting…";
                try {
                    await withTimeout(bootPromise, 8000, "Backend init");
                } catch (e) {
                    console.error("[NGL] init failed:", e);
                    if (myId !== loadId) return;
                    status.textContent = "Couldn't connect";
                    retry.classList.remove("hidden");
                    return;
                }

                status.textContent = "Fetching profile…";
                let result;
                try {
                    result = await withTimeout(
                        Backend.getProfile(targetHandle),
                        10000,
                        "Profile fetch",
                    );
                } catch (e) {
                    console.error("[NGL] fetch failed:", e);
                    if (myId !== loadId) return;
                    status.textContent = "Slow connection — try again";
                    retry.classList.remove("hidden");
                    return;
                }

                if (myId !== loadId) return;

                if (result === null) {
                    $("sender-wrap").classList.add("hidden");
                    $("sender-wrap").classList.remove("flex");
                    $("error-view").classList.remove("hidden");
                    $("error-view").classList.add("flex");
                    return;
                }
                if (result.paused) {
                    $("sender-wrap").classList.add("hidden");
                    $("sender-wrap").classList.remove("flex");
                    $("paused-view").classList.remove("hidden");
                    $("paused-view").classList.add("flex");
                    return;
                }

                writeCache(targetHandle, result);
                showRecipient(result);
            }

            loadRecipient();
        </script>
    </body>
</html>
