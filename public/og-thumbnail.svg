<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fa0f5c"/>
      <stop offset="50%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff6200"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f4"/>
    </linearGradient>

    <!-- Header Gradient for Message Card -->
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fa0f5c"/>
      <stop offset="100%" stop-color="#ff6200"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="240" y="80" width="720" height="490" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="200" cy="150" r="180" fill="#ffffff" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="220" fill="#ffef99" opacity="0.15" filter="url(#glow)"/>

  <!-- Main Floating Question Card -->
  <g filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect x="290" y="115" width="620" height="400" rx="36" fill="url(#cardGrad)"/>
    
    <!-- Top Header Banner inside Card -->
    <path d="M290 151C290 131.118 306.118 115 326 115H874C893.882 115 910 131.118 910 151V230H290V151Z" fill="url(#bubbleGrad)"/>
    
    <!-- Top Header User Profile Mock -->
    <circle cx="350" cy="172" r="28" fill="#ffffff" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
    <!-- Avatar Icon in Circle -->
    <circle cx="350" cy="165" r="10" fill="#fa0f5c"/>
    <path d="M333 186C333 177 341 175 350 175C359 175 367 177 367 186" stroke="#fa0f5c" stroke-width="3" stroke-linecap="round"/>

    <!-- Username & Prompt header text -->
    <text x="395" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">@ngl.user</text>
    <text x="395" y="190" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">send me anonymous messages!</text>

    <!-- Dice sticker on top right -->
    <rect x="835" y="152" width="40" height="40" rx="12" fill="#ffffff" fill-opacity="0.25"/>
    <text x="844" y="180" font-size="22">🎲</text>

    <!-- Message Bubble Area in Card Body -->
    <rect x="330" y="255" width="540" height="150" rx="24" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>
    <text x="360" y="315" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">What's a secret you've</text>
    <text x="360" y="355" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">never told anyone? 🤫</text>

    <!-- Bottom Action Pill: Send Button -->
    <rect x="430" y="435" width="340" height="56" rx="28" fill="#000000"/>
    <text x="600" y="471" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="0.5">Send Anonymous 🔒</text>
  </g>

  <!-- Left Floating Sticker: Anonymous Badge -->
  <g transform="translate(110, 200) rotate(-12)">
    <rect width="180" height="60" rx="20" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="90" y="38" text-anchor="middle" fill="#fa0f5c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900">✨ 100% ANONYMOUS</text>
  </g>

  <!-- Right Floating Sticker: Instagram Story -->
  <g transform="translate(920, 320) rotate(10)">
    <rect width="200" height="64" rx="20" fill="#000000" filter="url(#cardShadow)"/>
    <text x="100" y="40" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900">📸 Story Ready</text>
  </g>

  <!-- Top Brand Logo -->
  <text x="600" y="80" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Lilita One', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">NGL</text>
  <text x="600" y="105" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="2">ANONYMOUS Q&amp;A</text>
</svg>
